apiVersion: apps/v1
kind: Deployment
metadata: {name: probes}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: probes}}
  template:
    metadata: {labels: {app: probes}}
    spec:
      containers:
        - name: app
          image: shop.azurecr.io/probes:0.1.0
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: probes}
spec:
  selector: {app: probes}
  ports: [{port: 80, targetPort: 8080}]
